services:
  postgres:
    image: postgres:16-alpine
    container_name: nookfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nookfolio}
      POSTGRES_USER: ${POSTGRES_USER:-nookfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nookfolio_dev_only}
    ports:
      - '${POSTGRES_PORT:-54329}:5432'
    volumes:
      - nookfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nookfolio} -d ${POSTGRES_DB:-nookfolio}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  nookfolio_postgres_data:
