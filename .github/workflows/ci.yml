name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nookfolio
          POSTGRES_USER: nookfolio
          POSTGRES_PASSWORD: nookfolio_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nookfolio -d nookfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nookfolio:nookfolio_ci_only@127.0.0.1:5432/nookfolio?schema=public
      ADMIN_EMAIL: stage02-admin@example.com
      ADMIN_PASSWORD: stage-02-e2e-admin-password
      ADMIN_DISPLAY_NAME: Nookfolio

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm prisma:migrate:deploy

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Reset browser test database
        env:
          NOOKFOLIO_BROWSER_RESET: '1'
        run: pnpm test:reset-browser-data

      - name: Bootstrap test administrator
        run: pnpm admin:bootstrap

      - name: Seed browser test fixtures
        run: pnpm test:seed-browser-data

      - name: Verify browser fixture idempotence
        run: pnpm test:seed-browser-data

      - name: Create restore backup fixture
        run: |
          mkdir -p /tmp/nookfolio-backup/uploads /tmp/nookfolio-backup/geo
          pg_dump "postgresql://nookfolio:nookfolio_ci_only@127.0.0.1:5432/nookfolio" > /tmp/nookfolio-backup/database.sql
          tar -C /tmp/nookfolio-backup -czf /tmp/nookfolio-backup/uploads-geo.tgz uploads geo

      - name: Run real PostgreSQL restore test
        env:
          NOOKFOLIO_RESTORE_ADMIN_DATABASE_URL: postgresql://nookfolio:nookfolio_ci_only@127.0.0.1:5432/postgres
          NOOKFOLIO_RESTORE_ROOT: /tmp/nookfolio-restore-test
        run: sh scripts/backup/restore-test.sh /tmp/nookfolio-backup

      - name: Install browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Build production application
        run: pnpm build
